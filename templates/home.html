<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}?h={{ get_hash(path='style.css', sha_type=256, base64=false) | truncate(length=12, end='') }}">
</head>
<body>
    <nav>
        <a href="{{ get_url(path='/') }}">~</a>
        <a href="{{ get_url(path='/latest') }}">latest</a>
    </nav>

    <main>
        {% block content %}
        <h1>{{ section.title }}</h1>
        {{ section.content | safe }}
        {% endblock content %}
    </main>

    <footer>
        <a href="https://twitter.com/{{ config.extra.twitter }}" target="_blank" rel="noopener noreferrer">@{{ config.extra.twitter }}</a>
    </footer>
    <script>
      // build email links in the browser so the address never appears in the page source
      document.querySelectorAll('a.email-link').forEach(function (a) {
        a.href = 'mailto:' + a.dataset.user + '@' + a.dataset.domain;
      });
    </script>
    <script data-goatcounter="https://pietromiotti.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
